name: Atualizar Eventos SA

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write # Dá permissão para o robô salvar arquivos

jobs:
  update-events:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Rodar o Scraper
        run: python scraper.py

      - name: Salvar as mudanças no repositório
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add data/eventos-sa.json
          # O comando abaixo evita erro se o arquivo não tiver mudado
          git commit -m "🤖 Eventos SA atualizados automaticamente" || echo "Nada para commitar"
          git push
