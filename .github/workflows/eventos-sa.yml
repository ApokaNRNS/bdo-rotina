name: Atualizar eventos SA

on:
  schedule:
    - cron: "0 8 * * 4"
      timezone: "America/Sao_Paulo"
    - cron: "0 10 * * 4"
      timezone: "America/Sao_Paulo"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: eventos-sa
  cancel-in-progress: false
